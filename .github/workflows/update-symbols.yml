name: Update Symbol List

on:
  schedule:
    - cron: '0 22 * * 4'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update symbols.json
        run: python scripts/update_symbols.py

      - name: Commit symbols.json
        run: |
          git config user.name "alert-bot"
          git config user.email "alert-bot@users.noreply.github.com"
          git add symbols.json
          git diff --cached --quiet || git commit -m "بروزرسانی لیست نمادها"
          git push
