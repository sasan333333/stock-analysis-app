name: Check Stock Alerts

on:
  schedule:
    - cron: '*/30 5-9 * * 0,1,2,3,6'
  workflow_dispatch:
    inputs:
      force:
        description: 'اجرای فوری بدون بررسی ساعت بازار (برای تست)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alert check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_CHECK: ${{ github.event.inputs.force }}
        run: python scripts/check_alerts.py

      - name: Commit updated alerts.json
        run: |
          git config user.name "alert-bot"
          git config user.email "alert-bot@users.noreply.github.com"
          git add alerts.json
          git diff --cached --quiet || git commit -m "بروزرسانی وضعیت هشدارها"
          git push
