<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>هشدار قیمت بورس</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10141A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10141A; --panel:#171D26; --panel-2:#1D2530; --line:#2A323D;
    --paper:#EDEFF2; --muted:#8A94A3; --accent:#C9973F; --accent-ink:#2A2110;
    --long:#3FB889; --short:#DB5C50; --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--ink);color:var(--paper);font-family:'Vazirmatn',Tahoma,sans-serif;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;}
  .app{max-width:480px;margin:0 auto;padding:18px 16px 60px;}
  header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  header.top h1{font-size:19px;font-weight:800;margin:0;}
  .status{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0;}
  .dot.on{background:var(--long);} .dot.off{background:var(--short);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
  .card h2{font-size:14px;font-weight:700;margin:0 0 12px;}
  .card h2 small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px;}
  label.field{display:block;margin-bottom:12px;}
  label.field span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;}
  input[type=text],input[type=number]{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;color:var(--paper);padding:10px 12px;font-family:inherit;font-size:14.5px;outline:none;}
  input:focus,select:focus{border-color:var(--accent);}
  select{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;color:var(--paper);padding:10px 12px;font-family:inherit;font-size:14.5px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .btn-primary{width:100%;background:var(--accent);color:var(--accent-ink);border:none;border-radius:9px;padding:13px 0;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
  .btn-secondary{width:100%;background:transparent;color:var(--paper);border:1px solid var(--line);border-radius:9px;padding:11px 0;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;}
  .note{font-size:12.5px;color:var(--muted);margin-top:8px;}
  .error{background:rgba(219,92,80,.12);border:1px solid var(--short);color:#F2B3AC;border-radius:8px;padding:9px 12px;font-size:13px;margin-top:10px;}
  .success{background:rgba(63,184,137,.12);border:1px solid var(--long);color:#B9EBD6;border-radius:8px;padding:9px 12px;font-size:13px;margin-top:10px;}
  .togglebtn{background:none;border:none;color:var(--muted);font-family:inherit;font-size:12.5px;cursor:pointer;text-decoration:underline;padding:0;}
  .showpw{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;}
  .pwrow{position:relative;} .pwrow button{position:absolute;left:8px;top:8px;}
  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .stat{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:10px 4px;text-align:center;}
  .stat b{display:block;font-size:17px;font-weight:800;} .stat span{font-size:10.5px;color:var(--muted);}
  .alert-item{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;background:var(--panel);}
  .alert-item .erow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;}
  .alert-item .sym{font-weight:800;font-size:15.5px;}
  .alert-item .meta{color:var(--muted);font-size:12px;margin-top:2px;}
  .badge{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:20px;flex-shrink:0;white-space:nowrap;}
  .badge.active{background:rgba(201,151,63,.15);color:var(--accent);}
  .badge.done{background:rgba(63,184,137,.15);color:var(--long);}
  .alertactions{display:flex;gap:8px;margin-top:10px;}
  .alertactions button{background:var(--panel-2);border:1px solid var(--line);color:var(--paper);border-radius:7px;padding:6px 10px;font-family:inherit;font-size:12.5px;cursor:pointer;}
  .alertactions button.danger{color:var(--short);border-color:rgba(219,92,80,.4);}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:20px 0;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const STORAGE_KEY = 'sa-github-config';

let state = {
  config: {token:'', repo:''},
  showToken: false,
  settingsOpen: false,
  statusMsg: null,
  alerts: [],
  alertsSha: null,
  loading: false,
  _condition: 'gte'
};

async function loadState(){
  try{
    const cfg = await window.storage.get(STORAGE_KEY, false);
    if(cfg && cfg.value) state.config = JSON.parse(cfg.value);
  }catch(e){}
  state.settingsOpen = !(state.config.token && state.config.repo);
  render();
  if(state.config.token && state.config.repo) await refreshAlerts();
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
}

async function saveConfig(){ await window.storage.set(STORAGE_KEY, JSON.stringify(state.config), false); }

function escapeHtml(str){ return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(str){ return escapeHtml(str).replace(/"/g,'&quot;'); }
function b64encode(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64decode(str){ return decodeURIComponent(escape(atob(str.replace(/\n/g,'')))); }

async function ghGet(path){
  const {token, repo} = state.config;
  const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
    headers:{Authorization:`Bearer ${token}`, Accept:'application/vnd.github+json'}
  });
  if(res.status===404) return {content:null, sha:null};
  if(!res.ok){ const e = await res.json().catch(()=>({})); throw new Error(e.message || ('خطای گیت‌هاب: '+res.status)); }
  const data = await res.json();
  return {content: JSON.parse(b64decode(data.content)), sha: data.sha};
}

async function ghPut(path, obj, sha, message){
  const {token, repo} = state.config;
  const body = {message, content: b64encode(JSON.stringify(obj, null, 2))};
  if(sha) body.sha = sha;
  const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
    method:'PUT',
    headers:{Authorization:`Bearer ${token}`, Accept:'application/vnd.github+json', 'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  if(!res.ok){ const e = await res.json().catch(()=>({})); throw new Error(e.message || ('خطا در نوشتن: '+res.status)); }
  return await res.json();
}

async function onSaveSettings(){
  const token = document.getElementById('inp-token').value.trim();
  const repo = document.getElementById('inp-repo').value.trim();
  state.config = {token, repo};
  await saveConfig();
  state.statusMsg = {type:'success', text:'تنظیمات ذخیره شد.'};
  render();
  await refreshAlerts();
}
function onToggleSettings(){ state.settingsOpen = !state.settingsOpen; render(); }
function onToggleShowToken(){ state.showToken = !state.showToken; render(); }

async function refreshAlerts(){
  if(!state.config.token || !state.config.repo) return;
  state.loading = true; render();
  try{
    const {content, sha} = await ghGet('alerts.json');
    state.alerts = content || [];
    state.alertsSha = sha;
  }catch(e){
    state.statusMsg = {type:'error', text:'خطا در خواندن هشدارها: ' + e.message};
  }
  state.loading = false;
  render();
}

async function onAddAlert(){
  const symbol = document.getElementById('inp-symbol').value.trim();
  const targetPrice = document.getElementById('inp-price').value.trim();
  const condition = document.getElementById('inp-cond').value;

  if(!symbol || !targetPrice){
    state.statusMsg = {type:'error', text:'نماد و قیمت هدف را وارد کنید.'};
    render(); return;
  }
  if(!state.config.token || !state.config.repo){
    state.statusMsg = {type:'error', text:'ابتدا تنظیمات گیت‌هاب را کامل کنید.'};
    state.settingsOpen = true; render(); return;
  }

  state.loading = true; render();
  try{
    const {content, sha} = await ghGet('alerts.json');
    const alerts = content || [];
    alerts.push({
      id: Math.random().toString(36).slice(2,9),
      symbol, targetPrice, condition,
      createdAt: new Date().toISOString(),
      triggered:false
    });
    await ghPut('alerts.json', alerts, sha, `افزودن هشدار: ${symbol} @ ${targetPrice}`);
    state.alerts = alerts;
    state.statusMsg = {type:'success', text:'هشدار اضافه شد.'};
    document.getElementById('inp-symbol').value='';
    document.getElementById('inp-price').value='';
  }catch(e){
    state.statusMsg = {type:'error', text:'خطا در ثبت هشدار: ' + e.message};
  }
  state.loading = false;
  render();
}

async function onDeleteAlert(id){
  state.loading = true; render();
  try{
    const {content, sha} = await ghGet('alerts.json');
    const alerts = (content || []).filter(a=>a.id!==id);
    await ghPut('alerts.json', alerts, sha, 'حذف هشدار');
    state.alerts = alerts;
    state.statusMsg = {type:'success', text:'هشدار حذف شد.'};
  }catch(e){
    state.statusMsg = {type:'error', text:'خطا در حذف: ' + e.message};
  }
  state.loading = false;
  render();
}

function fmtDate(iso){
  try{ return new Date(iso).toLocaleString('fa-IR', {dateStyle:'short', timeStyle:'short'}); }catch(e){ return iso; }
}

function alertCardHtml(a){
  const condText = a.condition==='gte' ? 'رسیدن به قیمت یا بالاتر ↑' : 'رسیدن به قیمت یا پایین‌تر ↓';
  const badge = a.triggered ? `<span class="badge done">ارسال شد ✓</span>` : `<span class="badge active">فعال</span>`;
  return `
    <div class="alert-item">
      <div class="erow">
        <div>
          <div class="sym">${escapeHtml(a.symbol)}</div>
          <div class="meta">${condText} · هدف: ${escapeHtml(a.targetPrice)}</div>
          <div class="meta">ثبت: ${fmtDate(a.createdAt)}</div>
          ${a.triggered ? `<div class="meta">ارسال در: ${fmtDate(a.triggeredAt)} · قیمت لحظه ارسال: ${a.priceAtTrigger ?? '-'}</div>` : ''}
        </div>
        ${badge}
      </div>
      <div class="alertactions">
        <button class="danger" onclick="onDeleteAlert('${a.id}')">حذف</button>
      </div>
    </div>
  `;
}

function render(){
  const configured = state.config.token && state.config.repo;
  const app = document.getElementById('app');

  const settingsHtml = `
    <div class="card">
      <h2>تنظیمات گیت‌هاب<small>برای ذخیره لیست هشدارها روی مخزن پروژه</small></h2>
      ${state.settingsOpen ? `
        <label class="field">
          <span>توکن دسترسی گیت‌هاب (Personal Access Token)</span>
          <div class="pwrow">
            <input type="${state.showToken?'text':'password'}" id="inp-token" value="${escapeAttr(state.config.token)}" placeholder="ghp_...">
            <button class="showpw" onclick="onToggleShowToken()">${state.showToken?'پنهان':'نمایش'}</button>
          </div>
        </label>
        <label class="field">
          <span>owner/repo (مثال: sasan333333/stock-analysis-app)</span>
          <input type="text" id="inp-repo" value="${escapeAttr(state.config.repo)}" placeholder="username/repo-name">
        </label>
        <button class="btn-secondary" onclick="onSaveSettings()">ذخیره و بارگذاری</button>
        <div class="note">توکن باید دسترسی Contents (Read and Write) روی همین مخزن داشته باشد. توکن فقط در همین مرورگر شما ذخیره می‌شود.</div>
      ` : `<button class="togglebtn" onclick="onToggleSettings()">ویرایش تنظیمات</button>`}
    </div>
  `;

  const total = state.alerts.length;
  const active = state.alerts.filter(a=>!a.triggered).length;
  const done = state.alerts.filter(a=>a.triggered).length;
  const dashboardHtml = `
    <div class="card">
      <h2>وضعیت هشدارها</h2>
      <div class="stats-grid">
        <div class="stat"><b>${total}</b><span>کل</span></div>
        <div class="stat"><b>${active}</b><span>فعال</span></div>
        <div class="stat"><b>${done}</b><span>ارسال‌شده</span></div>
      </div>
    </div>
  `;

  const formHtml = `
    <div class="card">
      <h2>افزودن هشدار جدید</h2>
      <label class="field"><span>نماد</span>
        <input type="text" id="inp-symbol" list="symbol-list" placeholder="مثلاً فولاد">
        <datalist id="symbol-list">
          <option value="فولاد"><option value="فملی"><option value="خودرو"><option value="خساپا">
          <option value="شپنا"><option value="شستا"><option value="فارس"><option value="وبملت">
          <option value="وتجارت"><option value="وبصادر"><option value="رمپنا"><option value="کگل">
          <option value="کچاد"><option value="شبندر"><option value="اخابر"><option value="همراه">
          <option value="وغدیر"><option value="پترول"><option value="شتران"><option value="وپارس">
        </datalist>
      </label>
      <div class="row2">
        <label class="field"><span>قیمت هدف</span><input type="text" id="inp-price" placeholder="مثلاً 4500"></label>
        <label class="field"><span>شرط</span>
          <select id="inp-cond">
            <option value="gte">رسیدن به قیمت یا بالاتر ↑</option>
            <option value="lte">رسیدن به قیمت یا پایین‌تر ↓</option>
          </select>
        </label>
      </div>
      <button class="btn-primary" onclick="onAddAlert()" ${state.loading?'disabled':''}>ثبت هشدار</button>
      ${!configured ? '<div class="note">⚠️ ابتدا تنظیمات گیت‌هاب را کامل کنید.</div>' : ''}
    </div>
  `;

  const statusHtml = state.statusMsg ? `<div class="${state.statusMsg.type}">${escapeHtml(state.statusMsg.text)}</div>` : '';

  const listHtml = state.alerts.length
    ? state.alerts.slice().reverse().map(alertCardHtml).join('')
    : `<div class="empty">هنوز هشداری ثبت نشده است.</div>`;

  app.innerHTML = `
    <header class="top">
      <h1>هشدار قیمت بورس</h1>
      <div class="status"><span class="dot ${configured?'on':'off'}"></span>${configured?'متصل به گیت‌هاب':'پیکربندی نشده'}</div>
    </header>
    ${settingsHtml}
    ${statusHtml}
    ${dashboardHtml}
    ${formHtml}
    <div class="card">
      <h2>لیست هشدارها<small>${state.alerts.length} مورد</small></h2>
      <button class="btn-secondary" onclick="refreshAlerts()" style="margin-bottom:12px;">${state.loading?'در حال بارگذاری...':'بروزرسانی لیست'}</button>
      ${listHtml}
    </div>
  `;
}

loadState();
</script>
</body>
</html>
